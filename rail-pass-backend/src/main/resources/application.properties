# Database Configuration
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/railpass_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:roshan412}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.auto-commit=true

# JPA Configuration
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Server Port
server.port=${PORT:8081}

# Error Handling
server.error.include-message=always
server.error.include-stacktrace=never

# JWT Secret
jwt.secret=${JWT_SECRET:your-very-secure-and-long-secret-key-for-railpass-system-256-bit}

# CORS Allowed Origins
cors.allowed-origins=${FRONTEND_URL:http://localhost:5173,http://localhost:3000}

